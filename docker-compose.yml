name: merchantcashflow

# Config do postgresql para reutilizar.
x-postgres: &postgres
  image: postgres:17-alpine
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
    interval: 5s
    timeout: 3s
    retries: 20
  restart: unless-stopped

services:
  # infra: dbs e rabbitmq
  auth-db:
    <<: *postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: auth
    volumes: ["auth-db-data:/var/lib/postgresql/data"]

  ledger-db:
    <<: *postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ledger
    volumes: ["ledger-db-data:/var/lib/postgresql/data"]

  statement-db:
    <<: *postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: statement
    volumes: ["statement-db-data:/var/lib/postgresql/data"]

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
    restart: unless-stopped

  # apis e gateway
  auth-api:
    build:
      context: .
      dockerfile: src/Auth/MerchantCashFlow.Auth.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Auth: Host=auth-db;Database=auth;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Maximum Pool Size=30
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      DataProtection__KeyRingPath: /app/keys
    volumes:
      - "./logs/auth:/app/logs"
      - "auth-keys:/app/keys"
    depends_on:
      auth-db:
        condition: service_healthy
    restart: unless-stopped

  ledger-api:
    build:
      context: .
      dockerfile: src/Ledger/MerchantCashFlow.Ledger.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Ledger: Host=ledger-db;Database=ledger;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Maximum Pool Size=60
      ConnectionStrings__Broker: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
    volumes: ["./logs/ledger:/app/logs"]
    depends_on:
      ledger-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  statement-api:
    build:
      context: .
      dockerfile: src/Statement/MerchantCashFlow.Statement.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Statement: Host=statement-db;Database=statement;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Maximum Pool Size=60
      ConnectionStrings__Broker: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
    volumes: ["./logs/statement:/app/logs"]
    depends_on:
      statement-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: src/Gateway/MerchantCashFlow.Gateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
    ports: ["8080:8080"]
    volumes: ["./logs/gateway:/app/logs"]
    depends_on:
      - auth-api
      - ledger-api
      - statement-api
    restart: unless-stopped

volumes:
  auth-db-data:
  auth-keys:
  ledger-db-data:
  statement-db-data:
  rabbitmq-data:
